name: buildx

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 5"
  push:
    branches:
      - 'master'
  pull_request:

defaults:
  run:
    shell: bash

env:
  DOCKERHUB_USER: wiserain
  IMAGE_NAME: wiserain/rclone
  X_SKIP: "true"

jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    if: github.event_name != 'pull_request'
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.rclone-type }}
      cancel-in-progress: false
    strategy:
      matrix:
        rclone-type: [latest, mod]
    steps:
      -
        name: Check if buildx required
        run: |
          if [ "${{ matrix.rclone-type }}" = "latest" ]; then
            rclone_install_script_url="https://rclone.org/install.sh"
          elif [ "${{ matrix.rclone-type }}" = "mod" ]; then
            rclone_install_script_url="https://raw.githubusercontent.com/wiserain/rclone/mod/install.sh"
          fi
          curl -fsSL "$rclone_install_script_url" | sudo bash
          RCLONE_VER=$(rclone version | head -n1 | cut -f2 -dv)
          docker pull "${{ env.IMAGE_NAME }}:$RCLONE_VER" && X_SKIP=true || X_SKIP=false
          [[ "$GITHUB_EVENT_NAME" != "schedule" ]] && X_SKIP=false
          echo "X_SKIP=$X_SKIP" >> "$GITHUB_ENV"
      -
        name: Checkout
        if: env.X_SKIP == 'false'
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        if: env.X_SKIP == 'false'
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Buildx
        if: env.X_SKIP == 'false'
        uses: docker/setup-buildx-action@v4
      -
        name: Login to docker.io
        if: env.X_SKIP == 'false'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to ghcr.io
        if: env.X_SKIP == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Buildx and Push
        id: build
        if: env.X_SKIP == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:ci-${{ matrix.rclone-type }}
            ghcr.io/${{ env.IMAGE_NAME }}:ci-${{ matrix.rclone-type }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            RCLONE_TYPE=${{ matrix.rclone-type }}
          cache-from: type=gha,scope=rclone-${{ matrix.rclone-type }}
          cache-to: type=gha,mode=max,scope=rclone-${{ matrix.rclone-type }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
      -
        name: Verify Image
        if: env.X_SKIP == 'false'
        id: vars
        run: |
          IMAGE="${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker pull --platform=linux/amd64 "$IMAGE"
          VER=$(docker run --rm --platform=linux/amd64 --entrypoint=/usr/bin/rclone "$IMAGE" version | head -n1 | cut -f2 -d'v')
          test -n "$VER"
          echo "app_ver=$VER" >> "$GITHUB_OUTPUT"
      -
        name: Promote Tags
        if: env.X_SKIP == 'false'
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ matrix.rclone-type }}" \
            --tag "${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.app_ver }}" \
            "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ env.IMAGE_NAME }}:${{ matrix.rclone-type }}" \
            --tag "ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.app_ver }}" \
            "ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
      -
        name: Update Dockerhub description
        if: env.X_SKIP == 'false'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: ${{ steps.vars.outputs.github_desc }}
      -
        name: Notification
        uses: sarisia/actions-status-discord@v1
        if: env.X_SKIP == 'false' && always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          description: |
            ${{ env.IMAGE_NAME }}:${{ matrix.rclone-type }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.app_ver }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ matrix.rclone-type }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.app_ver }}

  buildx-on-pr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    if: github.event_name == 'pull_request'
    concurrency:
      group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}-${{ matrix.rclone-type }}
      cancel-in-progress: true
    strategy:
      matrix:
        rclone-type: [latest, mod]
    steps:
      -
        name: Check if buildx required
        run: |
          if [ "${{ matrix.rclone-type }}" = "latest" ]; then
            rclone_install_script_url="https://rclone.org/install.sh"
          elif [ "${{ matrix.rclone-type }}" = "mod" ]; then
            rclone_install_script_url="https://raw.githubusercontent.com/wiserain/rclone/mod/install.sh"
          fi
          curl -fsSL "$rclone_install_script_url" | sudo bash
          RCLONE_VER=$(rclone version | head -n1 | cut -f2 -dv)
          docker pull "${{ env.IMAGE_NAME }}:$RCLONE_VER" && X_SKIP=true || X_SKIP=false
          [[ "$GITHUB_EVENT_NAME" != "schedule" ]] && X_SKIP=false
          echo "X_SKIP=$X_SKIP" >> "$GITHUB_ENV"
      -
        name: Checkout
        if: env.X_SKIP == 'false'
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        if: env.X_SKIP == 'false'
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Buildx
        if: env.X_SKIP == 'false'
        uses: docker/setup-buildx-action@v4
      -
        name: Login to docker.io
        if: env.X_SKIP == 'false' && github.actor == github.event.repository.owner.login
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to ghcr.io
        if: env.X_SKIP == 'false' && github.actor == github.event.repository.owner.login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Buildx and Push
        if: env.X_SKIP == 'false' && github.actor == github.event.repository.owner.login
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:pr-${{ matrix.rclone-type }}-${{ github.event.pull_request.number }}
            ghcr.io/${{ env.IMAGE_NAME }}:pr-${{ matrix.rclone-type }}-${{ github.event.pull_request.number }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            RCLONE_TYPE=${{ matrix.rclone-type }}
          cache-from: type=gha,scope=rclone-${{ matrix.rclone-type }}
          pull: true
          push: true
      -
        name: Notification
        uses: sarisia/actions-status-discord@v1
        if: env.X_SKIP == 'false' && always() && github.actor == github.event.repository.owner.login
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          description: |
            ${{ env.IMAGE_NAME }}:pr-${{ matrix.rclone-type }}-${{ github.event.pull_request.number }}
            ghcr.io/${{ env.IMAGE_NAME }}:pr-${{ matrix.rclone-type }}-${{ github.event.pull_request.number }}
